name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv python install 3.11
      - run: uv sync --locked --all-packages
      - run: uv run python scripts/build_release.py --tag "$GITHUB_REF_NAME" --check-version
      - run: make check

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x86_64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: windows-2022
            target: windows-x86_64
          - runner: macos-15-intel
            target: macos-x86_64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.10"
      - run: uv python install 3.11
      - run: uv sync --locked --all-packages --group release
      - name: Build and smoke-test standalone app
        run: uv run --group release python scripts/build_release.py --tag "${{ github.ref_name }}"
      - uses: actions/attest@v4
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum lexdeck-* > SHA256SUMS.txt
      - name: Publish release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Lexdeck $GITHUB_REF_NAME" --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
